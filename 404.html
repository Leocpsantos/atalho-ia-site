<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Atalho IA</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1220">
<link rel="icon" type="image/svg+xml" href="/assets/simbolo-tecla.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--tinta:#0F1B2D;--laranja:#FF6A2B;--areia:#F4F1EA;--nevoa:#8A97AB;--claro:#C9D1DC}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;font-family:Inter,sans-serif;color:var(--areia);
    background:radial-gradient(ellipse 70% 50% at 80% 90%,rgba(255,106,43,.2),transparent 70%),#0A1220}
  main{max-width:560px;text-align:center}
  .tecla{width:120px;height:120px;margin:0 auto 32px;border-radius:28px;display:grid;place-items:center;
    background:linear-gradient(165deg,#2A4164,#1B2B44 60%);box-shadow:0 10px 0 #060C16}
  .tecla img{width:76px;height:76px}
  .codigo{font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:3px;color:var(--laranja);text-transform:uppercase}
  h1{margin:12px 0 0;font-family:'Space Grotesk',sans-serif;font-size:clamp(32px,7vw,48px);line-height:1.05;letter-spacing:-1.5px}
  p{margin:16px 0 32px;font-size:18px;line-height:1.5;color:var(--claro)}
  a{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:14px;background:var(--laranja);color:var(--tinta);
    font-weight:500;text-decoration:none;box-shadow:0 6px 0 #B8461A}
  a:focus-visible{outline:3px solid var(--areia);outline-offset:4px}
</style>
</head>
<body>
<main>
  <div class="tecla"><img src="/assets/simbolo-tecla.svg" alt=""></div>
  <span class="codigo">Erro 404</span>
  <h1>Esse caminho não leva a lugar nenhum.</h1>
  <p>A página que você procurou não existe ou mudou de endereço. Que tal pegar o atalho de volta?</p>
  <a href="/">Voltar para o início ↗</a>
</main>
</body>
</html>
